<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TV Teshis</title>
<script src="$WEBAPIS/webapis/webapis.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #10141a; color: #e8edf2; font-family: sans-serif; overflow: hidden; }
  #wrap { position: absolute; left: 80px; top: 80px; }
  h1 { font-size: 48px; margin: 0 0 24px 0; font-weight: normal; }
  #status { font-size: 36px; color: #7fd1ff; }
  p { font-size: 24px; color: #8b97a5; }
</style>
</head>
<body>
<div id="wrap">
  <h1>TV Teşhis</h1>
  <div id="status">Mac'teki sunucuya bağlanılıyor...</div>
  <p>Ölçüm kodu Mac'ten yüklenir. Çıkmak için kumandada Geri tuşu.</p>
</div>
<script>
  // Olcum kodu Mac'teki sunucudan gelir; boylece uygulamayi yeniden imzalamadan guncellenebilir.
  var __SERVER = "__SERVER__";
  window.__SERVER = __SERVER;
  document.addEventListener('keydown', function (e) {
    if (e.keyCode === 10009) { try { tizen.application.getCurrentApplication().exit(); } catch (err) {} }
  });
  (function () {
    var s = document.createElement('script');
    s.src = __SERVER + '/tizen-probe.js?t=' + Date.now();
    s.onerror = function () {
      document.getElementById('status').textContent = 'Sunucuya ulaşılamadı: ' + __SERVER;
    };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
